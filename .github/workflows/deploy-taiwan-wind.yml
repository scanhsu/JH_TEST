# 部署台灣風場教學模型至 GitHub Pages（Pages 首次啟用後重跑）
name: Deploy Taiwan Wind Model to Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/taiwan-wind/**'
      - '.github/workflows/deploy-taiwan-wind.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/taiwan-wind
          cp -r public/taiwan-wind/. _site/taiwan-wind/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./taiwan-wind/">
          <title>台灣風的四季</title>
          <p><a href="./taiwan-wind/">前往「台灣風的四季」互動教學模型 →</a></p>
          HTML

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
